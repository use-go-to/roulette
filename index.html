/* Note: ne PAS mettre crossorigin="anonymous" sur l'audio,
   sinon le navigateur applique une vérification CORS que les radios n'envoient pas. */
const jazz=$('jazzStream');
let musicOn=false,musicTried=false;
function tryStartMusic(){
  if(musicOn||musicTried)return;
  musicTried=true;
  jazz.volume=.28;
  jazz.play()
    .then(()=>{musicOn=true;$('music').textContent='♪ Jazz ON';$('music').style.color='#ffe9a0';})
    .catch(err=>{musicTried=false;console.log('Jazz indisponible :',err&&err.message||err);});
}
$('music').onclick=e=>{
  e.stopPropagation();
  if(musicOn){jazz.pause();musicOn=false;$('music').textContent='♪ Jazz OFF';$('music').style.color='';}
  else tryStartMusic();
};
